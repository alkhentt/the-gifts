<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat ulang tahun</title>
<meta name="description" content="Ada pesan dan hadiah buat kamu.">
<meta name="theme-color" content="#8ec9f2">
<meta property="og:title" content="Selamat ulang tahun 🎂">
<meta property="og:description" content="Ada pesan dan hadiah buat kamu.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
  :root {
    --sky-top: #7fc0f0;
    --sky-mid: #b9e0fa;
    --sky-low: #eaf6ff;
    --ink: #1d3557;
    --ink-soft: #4a6585;
    --accent: #e0607e;
    --line: #cfe5f7;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hand: "Caveat", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    line-height: 1.75;
    background:
      radial-gradient(240px 90px at 12% 14%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(320px 110px at 82% 8%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(280px 100px at 70% 42%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(300px 100px at 6% 66%, rgba(255,255,255,.75), transparent 70%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%);
    background-attachment: fixed;
    padding: calc(env(safe-area-inset-top, 0px) + 40px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px);
  }
  .card {
    max-width: 600px;
    margin: 0 auto;
    padding: 44px 32px 40px;
    background: rgba(255,255,255,.84);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(40,90,140,.15);
  }
  .to { font-family: var(--hand); font-size: 30px; color: var(--accent); margin-bottom: 4px; }
  .title { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 10vw, 58px); line-height: 1.08; margin-bottom: 28px; }
  .para { font-size: 17.5px; margin-bottom: 20px; }

  .section-title { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 40px 0 6px; }
  .section-sub { color: var(--ink-soft); font-size: 16px; margin-bottom: 18px; }

  .gifts { list-style: none; display: grid; gap: 14px; }
  .gift { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .gift h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.25; margin-bottom: 4px; }
  .gift p { font-size: 16px; color: var(--ink-soft); }

  .notes { margin-top: 26px; padding: 18px 20px; border-left: 3px solid var(--accent); background: rgba(255,255,255,.7); border-radius: 0 12px 12px 0; }
  .notes h3 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin-bottom: 6px; }
  .notes ul { padding-left: 18px; }
  .notes li { font-size: 16px; color: var(--ink-soft); margin-bottom: 6px; }

  .closing { margin-top: 36px; }
  .sign { margin-top: 8px; font-family: var(--hand); font-size: 34px; color: var(--accent); }
  .hidden { display: none; }
  @media (max-width: 480px) { .card { padding: 32px 22px 30px; } }
</style>
</head>

<body>

<!-- =====================================================
     EDIT BAGIAN INI AJA. Sisanya biarin.
     ===================================================== -->
<script>
const CONFIG = {
  namaDia: "Sayang",     // nama / panggilan dia
  namaLu:  "Aku",        // nama / panggilan lu (tanda tangan)

  judul: "Selamat ulang tahun!",

  // Paragraf ucapan ulang tahun (tampil paling atas)
  ucapan: [
    "Selamat ulang tahun, sayang. Semoga umur yang baru ini bawa banyak hal baik buat kamu: sehat terus, hati tenang, dan semua yang lagi kamu usahain pelan-pelan jadi kenyataan.",
    "Maaf ya, tahun ini aku belum bisa ada di sebelah kamu pas tiup lilin. LDR emang gini, tapi aku mau kamu tau kalau aku tetap mikirin kamu di hari spesial ini.",
    "Jadi aku siapin beberapa hadiah yang aku pilih satu-satu sambil bayangin kamu. Maaf ya, hadiahnya nggak seberapa, tapi semoga bisa bermanfaat buat kamu. Ini ceritanya:"
  ],

  hadiahJudul: "Hadiah dari aku",
  hadiahSub: "Enam barang, masing-masing ada alasannya.",

  hadiah: [
    {
      nama: "Kipas portable",
      isi: "Aku tau kamu gampang keringetan, apalagi cuaca di Palu yang panasnya nggak ngotak tiap hari. Semoga ini bikin kamu agak adem pas lagi di luar."
    },
    {
      nama: "Parfum",
      isi: "Aku pernah nyium aroma ini dan langsung kepikiran kamu, kayaknya cocok banget. Tapi selera wangi itu personal, jadi coba dulu ya. Kalau kamu suka, aku seneng banget."
    },
    {
      nama: "Bunga abadi",
      isi: "Karena sekarang aku belum bisa ngasih bunga asli langsung ke kamu, aku kirim yang ini dulu buat sementara. Bunga abadi ini nggak layu, jadi bisa nemenin kamu lebih lama. Bunganya juga bisa jadi lampu hias."
    },
    {
      nama: "Novel \"Jika Kucing Lenyap dari Dunia\"",
      isi: "Kamu pernah bilang lagi suka baca novel versi bukunya langsung, jadi aku pilihin yang ini. Judulnya soal kucing, dan aku inget kamu suka kucing. Semoga ceritanya cocok sama kamu."
    },
    {
      nama: "Lip balm",
      isi: "Bibir kamu sering kering, jadi aku beliin ini. Semoga cocok dan bikin kamu lebih nyaman."
    },
    {
      nama: "Gelang couple",
      isi: "Dari awal kita udah sepakat pengen punya satu barang couple, dan kita milih gelang. Jadi biarpun jauh, ada satu hal yang sama-sama kita pakai. Semoga kamu suka."
    }
  ],

  catatanJudul: "Catatan kecil",
  catatan: [
    "Ada silicon case buat kipas Jisulife-nya, biar kipasnya nggak gampang baret.",
    "Ada bola gabus kecil buat hiasan di dalam lampu bunga. Mau dipasang atau nggak, bebas, terserah kamu."
  ],

  penutup: "Sekali lagi, selamat ulang tahun. Makasih udah jadi kamu, dan makasih udah mau jalanin ini sama aku, dekat maupun jauh. Aku sayang kamu.",
  tandaTangan: "Dari aku, yang selalu kangen kamu ♥"
};
</script>

<main class="card">
  <p class="to" id="to"></p>
  <h1 class="title" id="title"></h1>
  <div id="ucapan"></div>

  <h2 class="section-title" id="hJudul"></h2>
  <p class="section-sub" id="hSub"></p>
  <ol class="gifts" id="gifts"></ol>

  <aside class="notes hidden" id="notes">
    <h3 id="nJudul"></h3>
    <ul id="nList"></ul>
  </aside>

  <p class="para closing" id="penutup"></p>
  <p class="sign" id="sign"></p>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  document.title = "Selamat ulang tahun, " + CONFIG.namaDia;
  $("to").textContent = "Untuk " + CONFIG.namaDia + ",";
  $("title").textContent = CONFIG.judul;

  CONFIG.ucapan.forEach((t) => {
    const p = document.createElement("p");
    p.className = "para";
    p.textContent = t;
    $("ucapan").appendChild(p);
  });

  $("hJudul").textContent = CONFIG.hadiahJudul;
  $("hSub").textContent = CONFIG.hadiahSub;
  CONFIG.hadiah.forEach((g) => {
    const li = document.createElement("li");
    li.className = "gift";
    const h = document.createElement("h3");
    h.textContent = g.nama;
    const p = document.createElement("p");
    p.textContent = g.isi;
    li.append(h, p);
    $("gifts").appendChild(li);
  });

  if (CONFIG.catatan && CONFIG.catatan.length) {
    $("nJudul").textContent = CONFIG.catatanJudul;
    CONFIG.catatan.forEach((t) => {
      const li = document.createElement("li");
      li.textContent = t;
      $("nList").appendChild(li);
    });
    $("notes").classList.remove("hidden");
  }

  $("penutup").textContent = CONFIG.penutup;
  $("sign").textContent = CONFIG.tandaTangan;
})();
</script>
</body>
</html>
