<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat kamu 💌</title>
<meta name="description" content="Ada sesuatu buat kamu. Buka ya.">
<meta name="theme-color" content="#2a1530">
<meta property="og:title" content="Buat kamu 💌">
<meta property="og:description" content="Ada sesuatu buat kamu. Buka ya.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
  :root {
    --night: #2a1530;
    --night-2: #3b1f45;
    --rose: #ff8fa8;
    --blush: #ffd9df;
    --gold: #ffcf8b;
    --text: #fbeff1;
    --muted: #cdb3d1;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hand: "Caveat", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 50% -10%, #5a2a63 0%, transparent 70%),
      radial-gradient(700px 500px at 100% 100%, #4a1f3d 0%, transparent 70%),
      var(--night);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.7;
    overflow-x: hidden;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 8px; }

  .screen { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
  .hidden { display: none !important; }

  /* ---------- Gift screen ---------- */
  .gift-hint { font-family: var(--serif); font-size: clamp(30px, 8vw, 48px); line-height: 1.15; margin-bottom: 8px; }
  .gift-sub { color: var(--muted); margin-bottom: 36px; }
  .gift-btn { display: block; padding: 12px; -webkit-tap-highlight-color: transparent; }
  .gift-btn svg { width: min(68vw, 280px); height: auto; overflow: visible; filter: drop-shadow(0 24px 40px rgba(0,0,0,.45)); }
  .lid { transform-origin: 50% 100%; transition: transform .9s cubic-bezier(.3,1.4,.5,1), opacity .6s .3s; }
  .gift-btn:hover .lid { transform: translateY(-6px) rotate(-2deg); }
  .gift-btn.open .lid { transform: translateY(-90px) rotate(-14deg); opacity: 0; }
  .gift-btn { animation: bob 2.8s ease-in-out infinite; }
  .gift-btn.open { animation: none; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .tap { margin-top: 28px; font-family: var(--hand); font-size: 26px; color: var(--gold); }

  /* ---------- Letter ---------- */
  .letter { max-width: 560px; margin: 0 auto; padding: 72px 24px 40px; }
  .to { font-family: var(--hand); font-size: 30px; color: var(--gold); margin-bottom: 12px; }
  .title { font-family: var(--serif); font-size: clamp(40px, 11vw, 68px); line-height: 1.05; font-weight: 400; margin-bottom: 36px; }
  .title em { color: var(--rose); }
  .para { font-size: 18px; color: var(--text); margin-bottom: 22px; opacity: 0; transform: translateY(10px); transition: opacity .9s, transform .9s; }
  .para.show { opacity: 1; transform: none; }

  .days {
    display: inline-flex; flex-direction: column; align-items: center;
    margin: 18px 0 40px; padding: 18px 32px;
    border: 1px solid rgba(255,143,168,.45); border-radius: 999px;
    opacity: 0; transition: opacity .9s;
  }
  .days.show { opacity: 1; }
  .days b { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1; color: var(--blush); }
  .days span { font-size: 14px; color: var(--muted); }

  /* ---------- Gift reveal ---------- */
  .reveal { margin: 24px 0 36px; padding: 28px 24px; border-radius: 28px; background: linear-gradient(160deg, var(--night-2), #4b2250); border: 1px solid rgba(255,207,139,.35); opacity: 0; transition: opacity .9s; }
  .reveal.show { opacity: 1; }
  .reveal small { display: block; color: var(--muted); margin-bottom: 6px; }
  .reveal h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 8vw, 44px); color: var(--gold); line-height: 1.15; }
  .reveal p { margin-top: 10px; color: var(--text); font-size: 16px; }

  .sign { font-family: var(--hand); font-size: 34px; color: var(--rose); opacity: 0; transition: opacity .9s; }
  .sign.show { opacity: 1; }
  .again { display: block; margin: 40px auto 0; padding: 10px 18px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- Floating hearts ---------- */
  #hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .heart { position: absolute; bottom: -40px; animation: rise linear forwards; will-change: transform, opacity; }
  @keyframes rise { to { transform: translateY(-110vh) translateX(var(--dx)) rotate(var(--rot)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .gift-btn, .heart { animation: none !important; }
    .lid, .para, .days, .reveal, .sign { transition: none !important; }
    .heart { display: none; }
  }
</style>
</head>

<body>

<!-- =====================================================
     EDIT BAGIAN INI AJA. Sisanya biarin.
     ===================================================== -->
<script>
const CONFIG = {
  namaDia:  "Sayang",            // nama / panggilan dia
  namaLu:   "Aku",               // nama / panggilan lu (tanda tangan)
  tanggalJadian: "2024-01-01",   // format YYYY-MM-DD. Kosongin ("") kalau gak mau ada counter hari
  judul:    "Ada sesuatu buat kamu",
  petunjuk: "Buka dulu ya",

  // Tiap item = 1 paragraf. Tambah / hapus bebas.
  pesan: [
    "Aku tau aku bukan orang yang paling jago ngomong manis. Jadi aku tulis aja di sini.",
    "Makasih udah sabar sama aku, udah nemenin di hari yang bagus maupun yang berantakan. Kamu bikin hal-hal biasa jadi kerasa spesial.",
    "Hadiah ini kecil dibanding apa yang udah kamu kasih ke aku. Tapi aku milihnya sambil mikirin kamu, dan itu yang paling penting buat aku.",
    "Semoga kamu suka. Dan kalau pun nggak, aku tetep bakal ada di sini."
  ],

  // Bagian reveal hadiah
  hadiah: {
    label: "Hadiahnya",
    nama:  "Isi nama hadiahnya di sini",
    catatan: "Kamu bisa ambil sekarang, atau nanti pas kita ketemu. 💝"
  },

  penutup: "Sayang kamu banyak-banyak"
};
</script>

<main>
  <!-- LAYAR 1: KADO -->
  <section class="screen" id="giftScreen">
    <h1 class="gift-hint" id="hint"></h1>
    <p class="gift-sub" id="sub"></p>

    <button class="gift-btn" id="giftBtn" aria-label="Buka kado">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <!-- box -->
        <rect x="30" y="90" width="140" height="95" rx="8" fill="#ff8fa8"/>
        <rect x="30" y="90" width="140" height="95" rx="8" fill="url(#shade)"/>
        <rect x="92" y="90" width="16" height="95" fill="#ffcf8b"/>
        <!-- lid -->
        <g class="lid">
          <rect x="22" y="62" width="156" height="36" rx="8" fill="#ff6f91"/>
          <rect x="92" y="62" width="16" height="36" fill="#ffcf8b"/>
          <path d="M100 62 C 70 20, 38 40, 70 62 Z" fill="#ffcf8b"/>
          <path d="M100 62 C 130 20, 162 40, 130 62 Z" fill="#ffcf8b"/>
          <circle cx="100" cy="62" r="9" fill="#e8a95a"/>
        </g>
        <defs>
          <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity=".0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".18"/>
          </linearGradient>
        </defs>
      </svg>
    </button>
    <p class="tap" id="tap">ketuk kadonya</p>
  </section>

  <!-- LAYAR 2: SURAT -->
  <section class="letter hidden" id="letter">
    <p class="to" id="to"></p>
    <h2 class="title" id="title"></h2>
    <div id="paras"></div>
    <div class="days" id="days"><b id="daysNum">0</b><span>hari bareng kamu</span></div>
    <div class="reveal" id="reveal">
      <small id="revLabel"></small>
      <h2 id="revName"></h2>
      <p id="revNote"></p>
    </div>
    <p class="sign" id="sign"></p>
    <button class="again" id="again">baca lagi dari awal</button>
  </section>
</main>

<div id="hearts" aria-hidden="true"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));

  // isi teks dari CONFIG
  document.title = "Buat " + CONFIG.namaDia + " 💌";
  $("hint").textContent = CONFIG.judul;
  $("sub").textContent = CONFIG.petunjuk;
  $("to").textContent = "Untuk " + CONFIG.namaDia + ",";
  $("title").innerHTML = "Makasih udah jadi <em>kamu</em>.";
  $("revLabel").textContent = CONFIG.hadiah.label;
  $("revName").textContent = CONFIG.hadiah.nama;
  $("revNote").textContent = CONFIG.hadiah.catatan;
  $("sign").textContent = CONFIG.penutup + ", " + CONFIG.namaLu + " ♥";

  // bikin paragraf
  const parasBox = $("paras");
  CONFIG.pesan.forEach((t) => {
    const p = document.createElement("p");
    p.className = "para";
    p.textContent = t;
    parasBox.appendChild(p);
  });

  // counter hari
  function hitungHari() {
    if (!CONFIG.tanggalJadian) { $("days").classList.add("hidden"); return; }
    const mulai = new Date(CONFIG.tanggalJadian + "T00:00:00");
    const hari = Math.floor((Date.now() - mulai.getTime()) / 86400000);
    if (isNaN(hari) || hari < 0) { $("days").classList.add("hidden"); return; }
    $("daysNum").textContent = hari.toLocaleString("id-ID");
  }
  hitungHari();

  // hati melayang
  function heart(emoji) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = emoji || ["💗", "💖", "💕", "✨", "🌸"][Math.floor(Math.random() * 5)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 16 + Math.random() * 22 + "px";
    h.style.animationDuration = 5 + Math.random() * 5 + "s";
    h.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    h.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
    $("hearts").appendChild(h);
    setTimeout(() => h.remove(), 11000);
  }
  function burst(n) { for (let i = 0; i < n; i++) setTimeout(heart, i * 90); }

  let running = false;

  async function bukaKado() {
    if (running) return;
    running = true;
    $("giftBtn").classList.add("open");
    $("tap").style.visibility = "hidden";
    burst(24);
    await wait(1100);

    $("giftScreen").classList.add("hidden");
    $("letter").classList.remove("hidden");
    window.scrollTo(0, 0);
    await wait(300);

    const items = [...document.querySelectorAll(".para")];
    for (const p of items) {
      p.classList.add("show");
      p.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
      await wait(1800);
    }
    if (!$("days").classList.contains("hidden")) {
      $("days").classList.add("show");
      await wait(1400);
    }
    $("reveal").classList.add("show");
    $("reveal").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    burst(18);
    await wait(1600);
    $("sign").classList.add("show");
    $("sign").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    setInterval(heart, 1400);
  }

  $("giftBtn").addEventListener("click", bukaKado);
  $("again").addEventListener("click", () => location.reload());
})();
</script>
</body>
</html>
